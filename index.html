<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Feed - Open Source Commons API</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .tiktok-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background: #000;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .tiktok-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .overlay * {
      pointer-events: auto;
    }
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
    }
    .top-bar span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 4px;
    }
    .bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .user-details {
      max-width: 75%;
    }
    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-btn svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .like-btn.liked svg {
      fill: #fe2c55;
      color: #fe2c55;
    }
    .disc-spin {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 8px solid #222;
      background: #000;
      animation: spin 3s linear infinite;
      margin-top: 8px;
    }
    .loading-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: #888;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="tiktok-container" id="feed">
  <div class="loading-notice" id="loader">Fetching Open API Videos...</div>
</div>

<script>
  const container = document.getElementById('feed');
  const loader = document.getElementById('loader');

  // Backup reliable open video MP4 pool if API requests stall
  const fallbackPool = [
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
    'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
    'https://www.w3schools.com/html/mov_bbb.mp4'
  ];

  let videoQueue = [];

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        video.play().catch(() => {});
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }, { threshold: 0.6 });

  // Open Source API query using Wikimedia Commons Media API
  async function fetchOpenApiVideos() {
    try {
      const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=Category:Videos&gcmtype=file&prop=imageinfo&iiprop=url|extmetadata&format=json&origin=*';
      const res = await fetch(url);
      const data = await res.json();
      
      const pages = data.query ? data.query.pages : {};
      const items = [];

      for (const key in pages) {
        const info = pages[key].imageinfo ? pages[key].imageinfo[0] : null;
        if (info && info.url && info.url.endsWith('.mp4')) {
          items.push({
            url: info.url,
            user: '@wikimedia_creator',
            caption: pages[key].title.replace('File:', ''),
            music: '🎵 Wikimedia Commons Open Source'
          });
        }
      }

      // Return shuffled array or fallback if empty
      return items.length > 0 ? items.sort(() => Math.random() - 0.5) : getFallbackItems();
    } catch (e) {
      console.warn('API error, using fallbacks:', e);
      return getFallbackItems();
    }
  }

  function getFallbackItems() {
    return fallbackPool.map((url, idx) => ({
      url: url,
      user: `@creator_${idx + 1}`,
      caption: 'Open source video clip stream ✨',
      music: '🎵 Creative Commons Audio'
    }));
  }

  function createCard(item) {
    const card = document.createElement('div');
    card.className = 'video-card';

    const likes = (Math.random() * 40 + 1).toFixed(1) + 'K';
    const comments = Math.floor(Math.random() * 300 + 10);

    card.innerHTML = `
      <video loop playsinline muted preload="metadata" src="${item.url}"></video>
      <div class="overlay">
        <div class="top-bar">
          <span>Following</span>
          <span class="active">Open Source</span>
        </div>
        <div class="bottom-section">
          <div class="user-details">
            <div class="username">${item.user}</div>
            <div class="caption">${item.caption}</div>
            <div class="music">${item.music}</div>
          </div>
          <div class="sidebar">
            <button class="action-btn" onclick="toggleAudio(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <span class="sound-label">Muted</span>
            </button>
            <button class="action-btn like-btn" onclick="toggleLike(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span class="count">${likes}</span>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
              <span>${comments}</span>
            </button>
            <div class="disc-spin"></div>
          </div>
        </div>
      </div>
    `;

    const video = card.querySelector('video');

    // Automatic black-screen prevention: swap to fallback URL if video fails to load
    video.onerror = () => {
      const backup = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
      if (video.src !== backup) {
        video.src = backup;
        video.load();
      }
    };

    card.addEventListener('click', (e) => {
      if (!e.target.closest('button')) {
        video.muted = !video.muted;
        const label = card.querySelector('.sound-label');
        if (label) label.textContent = video.muted ? 'Muted' : 'Sound On';
      }
    });

    observer.observe(card);
    return card;
  }

  async function loadMoreVideos(count = 3) {
    if (videoQueue.length < count) {
      const newItems = await fetchOpenApiVideos();
      videoQueue.push(...newItems);
    }

    if (loader) loader.style.display = 'none';

    for (let i = 0; i < count && videoQueue.length > 0; i++) {
      const item = videoQueue.shift();
      container.appendChild(createCard(item));
    }
  }

  container.addEventListener('scroll', () => {
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 300) {
      loadMoreVideos(2);
    }
  });

  function toggleLike(btn) {
    btn.classList.toggle('liked');
  }

  function toggleAudio(btn) {
    const card = btn.closest('.video-card');
    const video = card.querySelector('video');
    const label = card.querySelector('.sound-label');
    video.muted = !video.muted;
    if (label) label.textContent = video.muted ? 'Muted' : 'Sound On';
  }

  // Initial load
  loadMoreVideos(4);
</script>

</body>
</html>
