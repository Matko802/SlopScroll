<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Infinite Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .tiktok-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background: #000;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .tiktok-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }
    .overlay * {
      pointer-events: auto;
    }
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
    }
    .top-bar span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 4px;
    }
    .bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .user-details {
      max-width: 75%;
    }
    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-btn svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .like-btn.liked svg {
      fill: #fe2c55;
      color: #fe2c55;
    }
    .disc-spin {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 8px solid #222;
      background: #000;
      animation: spin 3s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #888;
      font-size: 14px;
      scroll-snap-align: start;
    }
  </style>
</head>
<body>

<div class="tiktok-container" id="feed">
  <div class="loader" id="loader">Loading videos...</div>
</div>

<script>
  // Add a free Pexels API Key here for unlimited live video queries across various topics
  const PEXELS_API_KEY = ''; 

  const container = document.getElementById('feed');
  const loader = document.getElementById('loader');

  // Fallback public video collection
  const sampleVideos = [
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', user: '@blaze_master', caption: 'High heat visuals 🔥 #viral #fyp', music: '🎵 Original Sound - Blaze' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', user: '@escape_artist', caption: 'Escaping into nature ✨ #outdoors #travel', music: '🎵 Chill Beats' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4', user: '@fun_times', caption: 'Never stop exploring 🚀 #explore #adventure', music: '🎵 Electric Waves' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', user: '@joyrider', caption: 'Cruising through the city lights 🌆 #driving', music: '🎵 Night Drive Beats' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4', user: '@slowmo_clips', caption: 'Ultra slow motion captured 🎥 #slowmo', music: '🎵 Ambient Waves' }
  ];

  const categories = ['nature', 'city', 'ocean', 'technology', 'dance', 'cars', 'abstract'];
  let page = 1;

  // Plays active video and pauses background videos
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        video.play().catch(() => {});
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }, { threshold: 0.7 });

  // DOM Generator for Video Cards
  function createVideoCard({ src, user, caption, music }) {
    const card = document.createElement('div');
    card.className = 'video-card';

    const likes = (Math.random() * 80 + 2).toFixed(1) + 'K';
    const comments = Math.floor(Math.random() * 900 + 100);

    card.innerHTML = `
      <video loop playsinline src="${src}"></video>
      <div class="overlay">
        <div class="top-bar">
          <span>Following</span>
          <span class="active">For You</span>
        </div>
        <div class="bottom-section">
          <div class="user-details">
            <div class="username">${user}</div>
            <div class="caption">${caption}</div>
            <div class="music">${music}</div>
          </div>
          <div class="sidebar">
            <button class="action-btn like-btn" onclick="toggleLike(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span class="count">${likes}</span>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
              <span>${comments}</span>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              <span>Share</span>
            </button>
            <div class="disc-spin"></div>
          </div>
        </div>
      </div>
    `;

    observer.observe(card);
    return card;
  }

  // Infinite Video Fetcher
  async function loadMoreVideos() {
    if (PEXELS_API_KEY) {
      try {
        const query = categories[Math.floor(Math.random() * categories.length)];
        const res = await fetch(`https://api.pexels.com/videos/search?query=${query}&orientation=portrait&per_page=5&page=${page++}`, {
          headers: { Authorization: PEXELS_API_KEY }
        });
        const data = await res.json();

        if (data.videos && data.videos.length > 0) {
          data.videos.forEach(v => {
            const file = v.video_files.find(f => f.width < 1080 && f.link.endsWith('.mp4')) || v.video_files[0];
            container.insertBefore(createVideoCard({
              src: file.link,
              user: `@${v.user.name.toLowerCase().replace(/\s+/g, '_')}`,
              caption: `Random ${query} clip ✨ #pexels #fyp #${query}`,
              music: `🎵 Original Sound - ${v.user.name}`
            }), loader);
          });
          return;
        }
      } catch (err) {
        console.warn('Live API fetch skipped, using sample fallback pool.', err);
      }
    }

    // Fallback: Randomize internal pool
    const shuffled = [...sampleVideos].sort(() => 0.5 - Math.random());
    shuffled.forEach(v => container.insertBefore(createVideoCard(v), loader));
  }

  // Infinite Scroll Trigger
  container.addEventListener('scroll', () => {
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 300) {
      loadMoreVideos();
    }
  });

  function toggleLike(btn) {
    btn.classList.toggle('liked');
  }

  // Initial Load
  loadMoreVideos();
</script>

</body>
</html>
