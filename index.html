<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Remake - YouTube Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .tiktok-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background: #000;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .tiktok-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      transform: scale(1.3); /* Fits YouTube player aspect ratio to portrait display */
      pointer-events: none; /* Passes click events through to overlay */
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .overlay * {
      pointer-events: auto;
    }
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
    }
    .top-bar span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 4px;
    }
    .bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .user-details {
      max-width: 75%;
    }
    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-btn svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .like-btn.liked svg {
      fill: #fe2c55;
      color: #fe2c55;
    }
    .disc-spin {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 8px solid #222;
      background: #000;
      animation: spin 3s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="tiktok-container" id="feed"></div>

<script>
  // Random YouTube Shorts/Video IDs Pool
  const youtubePool = [
    { id: 'jfKfPfyJRdk', user: '@lofi_girl', caption: 'Beats to relax/study to 🎧 #lofi #youtube' },
    { id: '5qap5aO4i9A', user: '@chilled_vibes', caption: 'Late night aesthetic ✨ #shorts #vibes' },
    { id: '3JZ_D3ELwOQ', user: '@tech_shorts', caption: 'Short coding clip 💻 #dev #shorts' },
    { id: 'L_LUpnjgPso', user: '@ambient_nature', caption: 'Relaxing views 🌿 #nature #shorts' },
    { id: '2g811Ko7K8U', user: '@music_daily', caption: 'Acoustic sessions 🎸 #music' }
  ];

  const container = document.getElementById('feed');

  // Send API commands directly to YouTube iframe via postMessage
  function sendYTCommand(iframe, func, args = []) {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: func, args: args }),
        '*'
      );
    }
  }

  // Intersection Observer for Youtube iFrames
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const iframe = entry.target.querySelector('iframe');
      if (!iframe) return;

      if (entry.isIntersecting) {
        sendYTCommand(iframe, 'playVideo');
      } else {
        sendYTCommand(iframe, 'pauseVideo');
      }
    });
  }, { threshold: 0.6 });

  // Get random video from pool
  function getRandomVideo() {
    return youtubePool[Math.floor(Math.random() * youtubePool.length)];
  }

  function createCard() {
    const card = document.createElement('div');
    card.className = 'video-card';

    const item = getRandomVideo();
    const likes = (Math.random() * 90 + 5).toFixed(1) + 'K';
    const comments = Math.floor(Math.random() * 900 + 100);

    // Build YouTube embed string with API enabled
    const embedUrl = `https://www.youtube.com/embed/${item.id}?enablejsapi=1&autoplay=1&mute=1&controls=0&loop=1&playlist=${item.id}&rel=0&modestbranding=1`;

    card.innerHTML = `
      <iframe src="${embedUrl}" allow="autoplay; encrypted-media" frameborder="0"></iframe>
      <div class="overlay">
        <div class="top-bar">
          <span>Following</span>
          <span class="active">For You</span>
        </div>
        <div class="bottom-section">
          <div class="user-details">
            <div class="username">${item.user}</div>
            <div class="caption">${item.caption}</div>
            <div class="music">🎵 YouTube Sound Stream</div>
          </div>
          <div class="sidebar">
            <button class="action-btn" onclick="toggleAudio(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <span class="sound-label">Muted</span>
            </button>
            <button class="action-btn like-btn" onclick="toggleLike(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span class="count">${likes}</span>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
              <span>${comments}</span>
            </button>
            <div class="disc-spin"></div>
          </div>
        </div>
      </div>
    `;

    let isMuted = true;
    card.addEventListener('click', (e) => {
      if (!e.target.closest('button')) {
        const iframe = card.querySelector('iframe');
        const soundLabel = card.querySelector('.sound-label');
        isMuted = !isMuted;
        sendYTCommand(iframe, isMuted ? 'mute' : 'unMute');
        if (soundLabel) soundLabel.textContent = isMuted ? 'Muted' : 'Sound On';
      }
    });

    observer.observe(card);
    return card;
  }

  function appendBatch(count = 3) {
    for (let i = 0; i < count; i++) {
      container.appendChild(createCard());
    }
  }

  // Infinite Scroll Trigger
  container.addEventListener('scroll', () => {
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 200) {
      appendBatch(2);
    }
  });

  function toggleLike(btn) {
    btn.classList.toggle('liked');
  }

  function toggleAudio(btn) {
    const card = btn.closest('.video-card');
    const iframe = card.querySelector('iframe');
    const soundLabel = card.querySelector('.sound-label');
    const isMuted = soundLabel.textContent === 'Sound On';

    sendYTCommand(iframe, isMuted ? 'mute' : 'unMute');
    soundLabel.textContent = isMuted ? 'Muted' : 'Sound On';
  }

  // Initial load
  appendBatch(3);
</script>

</body>
</html>
