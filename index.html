<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Static Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .tiktok-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background: #000;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .tiktok-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }
    .overlay * {
      pointer-events: auto;
    }
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
    }
    .top-bar span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 4px;
    }
    .bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .user-details {
      max-width: 75%;
    }
    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-btn svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .like-btn.liked svg {
      fill: #fe2c55;
      color: #fe2c55;
    }
    .disc-spin {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 8px solid #222;
      background: #000;
      animation: spin 3s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="tiktok-container" id="feed"></div>

<script>
  // CORS-permissive direct video assets ready for static hosting
  const staticVideoUrls = [
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubteAventuras.mp4',
    'https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4',
    'https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4',
    'https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-leaves-low-angle-shot-4006-large.mp4'
  ];

  const creators = ['@cyber_coder', '@matrix_dev', '@pixel_vibe', '@neon_rebel', '@future_labs', '@git_master'];
  const hashtags = ['#coding', '#webdev', '#github', '#tech', '#viral', '#fyp', '#buildinpublic'];
  const audioTracks = ['🎵 Original Sound - dev_vibes', '🎵 Chill Lofi Beats', '🎵 Cyberpunk Ambient', '🎵 Electronic Wave'];

  const container = document.getElementById('feed');

  // IntersectionObserver to auto-play focused video and stop hidden ones
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        video.play().catch(() => {});
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }, { threshold: 0.6 });

  // Random item selector
  const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function createCard() {
    const card = document.createElement('div');
    card.className = 'video-card';

    const videoUrl = getRandom(staticVideoUrls);
    const user = getRandom(creators);
    const tag1 = getRandom(hashtags);
    const tag2 = getRandom(hashtags);
    const music = getRandom(audioTracks);
    const likes = (Math.random() * 80 + 1).toFixed(1) + 'K';
    const comments = Math.floor(Math.random() * 800 + 50);

    card.innerHTML = `
      <video loop playsinline muted src="${videoUrl}"></video>
      <div class="overlay">
        <div class="top-bar">
          <span>Following</span>
          <span class="active">For You</span>
        </div>
        <div class="bottom-section">
          <div class="user-details">
            <div class="username">${user}</div>
            <div class="caption">Random static feed sample ✨ ${tag1} ${tag2}</div>
            <div class="music">${music}</div>
          </div>
          <div class="sidebar">
            <button class="action-btn" onclick="toggleAudio(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <span>Sound</span>
            </button>
            <button class="action-btn like-btn" onclick="toggleLike(this)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span class="count">${likes}</span>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
              <span>${comments}</span>
            </button>
            <div class="disc-spin"></div>
          </div>
        </div>
      </div>
    `;

    // Toggle mute state on card tap
    card.addEventListener('click', (e) => {
      if (!e.target.closest('button')) {
        const video = card.querySelector('video');
        video.muted = !video.muted;
      }
    });

    observer.observe(card);
    return card;
  }

  function appendBatch(count = 3) {
    for (let i = 0; i < count; i++) {
      container.appendChild(createCard());
    }
  }

  // Infinite Scroll Listener
  container.addEventListener('scroll', () => {
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 250) {
      appendBatch(2);
    }
  });

  function toggleLike(btn) {
    btn.classList.toggle('liked');
  }

  function toggleAudio(btn) {
    const card = btn.closest('.video-card');
    const video = card.querySelector('video');
    video.muted = !video.muted;
  }

  // Initial feed generation
  appendBatch(4);
</script>

</body>
</html>
